<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 100">
  <defs>
    <linearGradient id="g" x1="14" y1="0" x2="81" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f97316"/>
      <stop offset="50%"  stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Speed streaks (trailing, orange zone) -->
  <line x1="14" y1="32" x2="34" y2="32" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="17" y1="41" x2="32" y2="41" stroke="url(#g)" stroke-width="2"   stroke-linecap="round"/>
  <line x1="20" y1="50" x2="30" y2="50" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="70" cy="14" r="6" fill="none" stroke="url(#g)" stroke-width="3"/>

  <!-- Torso (forward lean) -->
  <path d="M 70 20 C 69 30 67 37 65 44"
        fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Front arm (swinging forward and up → indigo) -->
  <path d="M 68 30 C 73 27 77 24 80 21"
        fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>

  <!-- Back arm (swinging back and down → azure) -->
  <path d="M 68 30 C 63 35 58 40 55 44"
        fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>

  <!-- Front leg (leading, extended → indigo) -->
  <path d="M 65 44 C 69 54 73 63 76 73"
        fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Back leg (trailing, bent-knee kick → azure/orange) -->
  <path d="M 65 44 C 62 52 58 58 56 62 C 54 65 50 63 48 58"
        fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round"/>
</svg>
